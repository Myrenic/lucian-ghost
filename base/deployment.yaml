# Ghost, running the client's site.
#
# No image registry in this cluster and no database server either: the theme and
# the legacy URLs travel as ConfigMaps and an initContainer unpacks them into a
# Longhorn volume that holds Ghost's whole world - the SQLite database, the
# images the client uploads, and the theme itself.
#
# See the README for why SQLite (one writer, nothing to patch, `ghost export`
# for backups) and what it costs (one replica, no concurrent staff editing).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lucian-ghost
  namespace: services
  labels:
    app: lucian-ghost
    app.kubernetes.io/name: lucian-ghost
spec:
  replicas: 1
  # One writer: the volume holds SQLite, so the old pod has to be gone before
  # the new one starts rather than overlapping.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lucian-ghost
  template:
    metadata:
      labels:
        app: lucian-ghost
        app.kubernetes.io/name: lucian-ghost
      annotations:
        # Stamped by scripts/build-theme.mjs on every build. The theme is
        # unpacked by an initContainer, which only runs when a pod starts - so
        # without this, a new ConfigMap would be applied and never read.
        checksum/theme: "9c0a2907d004f9b2344b1243a6a77c97"
        # Same for the content directory: routes.yaml is read once, at boot, and a
        # stale copy costs a 404 on every article. Stamped by
        # scripts/import-content.mjs.
        checksum/content: "799df892b8435d1db14de626c9425eac"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # The official image runs Ghost as the "node" user (uid 1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-content
          image: docker.io/library/busybox:1.37
          # The script itself is gzipped base64 in a ConfigMap: Flux runs
          # envsubst over this manifest, and a shell script in a block scalar is
          # a pile of "${...}" for it to substitute away. Nothing here needs a
          # variable, so nothing here can be substituted.
          command:
            - /bin/sh
            - -c
            - gunzip -c /scripts/install-theme.sh.gz | sh
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: theme
              mountPath: /theme
              readOnly: true
            - name: content-dir
              mountPath: /content-dir
              readOnly: true
            - name: content
              mountPath: /content
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: ghost
          image: docker.io/library/ghost:6-alpine
          ports:
            - name: http
              containerPort: 2368
          env:
            - name: url
              value: "https://lucian.${SECRET_DOMAIN_0}"
            - name: NODE_ENV
              value: production
            - name: TZ
              value: "${TZ}"
            - name: database__client
              value: sqlite3
            - name: database__connection__filename
              value: /var/lib/ghost/content/data/ghost.db
            - name: database__useNullAsDefault
              value: "true"
            # Absolute on purpose: Ghost builds express-hbs's layout guard from
            # this path, and a relative one makes it compare "content/themes/lucian"
            # against absolute layout paths - every page then fails with "does not
            # reside in content/themes/lucian".
            - name: paths__contentPath
              value: /var/lib/ghost/content
            - name: logging__level
              value: info
            # Ghost 6 emails a 6-digit code for every login after the first, so
            # without mail nobody can sign in or invite a colleague. This turns
            # that off: the password is the only factor until an SMTP Secret
            # exists. Drop it once lucian-ghost-mail is configured - and note
            # that /ghost is LAN-only either way, which is what makes it
            # defensible now.
            - name: security__staffDeviceVerification
              value: "false"
          # Mail is only needed to send the sign-in verification code, and for
          # any newsletter the client starts later. Optional on purpose: without
          # the Secret Ghost runs, but a staff login from a new device cannot
          # finish (the first login after install skips the code). The keys are
          # Ghost's own config names - mail__transport=SMTP, mail__options__host,
          # mail__options__port, mail__options__auth__user,
          # mail__options__auth__pass, mail__from.
          envFrom:
            - secretRef:
                name: lucian-ghost-mail
                optional: true
          volumeMounts:
            - name: content
              mountPath: /var/lib/ghost/content
            # The root filesystem is read-only; Ghost's CLI and sharp want /tmp.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          # Both probes are socket checks on purpose. Ghost redirects any
          # request whose Host is not its configured url, and the kubelet cannot
          # send one: Go's client ignores a Host header set through httpHeaders
          # and uses the address it dialled, so an HTTP probe always gets a 301
          # and the kubelet reports "Probe terminated redirects". That redirect
          # points at the public URL, which is only routable once the pod is
          # Ready - a circle worth not designing for. Ghost listens only after
          # its migrations finish, which is what these gates need to know.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: scripts
          configMap:
            name: lucian-ghost-scripts
        - name: theme
          configMap:
            name: lucian-ghost-theme
        - name: content-dir
          configMap:
            name: lucian-ghost-content
        - name: content
          persistentVolumeClaim:
            claimName: lucian-ghost-content
        - name: tmp
          emptyDir: {}
