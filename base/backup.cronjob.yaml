# A nightly content export, because this cluster has no other backup: no Longhorn
# RecurringJob, no off-cluster copy, and the database sits on a volume nothing
# else copies.
#
# The job asks the running Ghost for its export over the Admin API instead of
# reading the content volume. That volume is ReadWriteOnce and already mounted by
# the Ghost pod, so a second pod cannot have it at all (a CronJob on the same
# claim sits in ContainerCreating for ever), and a second Ghost process against
# the same SQLite file is not something to run on a schedule. The export lands on
# a small volume of its own.
#
# Needs Secret lucian-ghost-backup with key admin_api_key - a plain integration
# key is enough, Ghost's token allowlist lets integrations read /db/:
#
#   kubectl -n services create secret generic lucian-ghost-backup \
#     --from-literal=admin_api_key=<id>:<secret>
#
# Without it the job cannot start, which is the loudest way to say "backups are
# not configured".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lucian-ghost-backups
  namespace: services
  labels:
    app: lucian-ghost
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-2-replicas
  resources:
    requests:
      storage: 1Gi

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lucian-ghost-backup
  namespace: services
  labels:
    app: lucian-ghost
    app.kubernetes.io/name: lucian-ghost
    app.kubernetes.io/component: backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: lucian-ghost
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # The script ships gzipped and flattened (a ConfigMap key may not
            # contain a slash, and Flux's envsubst must not see shell or JS
            # variables), so it is unpacked before node runs it.
            - name: unpack
              image: docker.io/library/busybox:1.37
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  mkdir -p /scripts/lib
                  gunzip -c /packed/backup.mjs.gz > /scripts/backup.mjs
                  gunzip -c /packed/lib__ghost-admin.mjs.gz > /scripts/lib/ghost-admin.mjs
              volumeMounts:
                - name: packed
                  mountPath: /packed
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: export
              image: docker.io/library/ghost:6-alpine
              command:
                - node
                - /scripts/backup.mjs
              env:
                - name: GHOST_URL
                  value: "https://lucian.${SECRET_DOMAIN_0}"
                - name: BACKUP_DIR
                  value: /backups
                - name: GHOST_ADMIN_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lucian-ghost-backup
                      key: admin_api_key
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 20m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: packed
              configMap:
                name: lucian-ghost-scripts
            - name: scripts
              emptyDir: {}
            - name: backups
              persistentVolumeClaim:
                claimName: lucian-ghost-backups
            - name: tmp
              emptyDir: {}
