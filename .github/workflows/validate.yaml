name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      - name: Manifests build
        run: kubectl kustomize . >/dev/null

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      # Ghost's own linter, and the verdict the client sees in their admin. Not
      # --fatal: that flag means "show only fatal errors", so it reported a clean
      # theme while the admin listed two errors and three warnings.
      - name: Ghost theme compatibility
        run: |
          set -euo pipefail
          npx --yes gscan@latest theme | tee /tmp/gscan.txt
          if grep -qE "Your theme has" /tmp/gscan.txt; then
            echo "::error::gscan found problems - see the report above"
            exit 1
          fi

      # And the checks GScan does not make - see the header of the script.
      - name: Templates are sound
        run: node scripts/check-templates.mjs

      # Not a byte comparison: gzip output differs between zlib versions, so that
      # would fail for a theme nobody touched. --check compares what the committed
      # ConfigMaps decompress to against the repository.
      - name: ConfigMaps match the repository
        run: |
          set -euo pipefail
          npm --prefix theme ci
          node scripts/build-theme.mjs --check
