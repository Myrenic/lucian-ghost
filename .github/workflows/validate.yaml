name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: theme/package-lock.json

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      - name: Manifests build
        run: kubectl kustomize . >/dev/null

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      # Ghost's own linter: the client's admin shows its verdict on the theme, so
      # a theme that fails it fails in front of them.
      - name: Ghost theme compatibility
        run: npx --yes gscan@latest --fatal theme

      # And the checks GScan does not make - see the header of the script.
      - name: Templates are sound
        run: node scripts/check-templates.mjs

      - name: Theme and ConfigMaps rebuild byte-identically
        run: |
          set -euo pipefail
          npm --prefix theme ci
          node scripts/build-theme.mjs
          if ! git diff --quiet; then
            echo "::error::build output differs from the committed ConfigMaps - run the build and commit"
            git --no-pager diff --stat
            exit 1
          fi
